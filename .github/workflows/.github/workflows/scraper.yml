name: Bundesliga Data Scraper

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch: # İstediğinizde elle tetikleme butonu açar

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları ve Playwright Chrome'u Kur
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium
          playwright install-deps

      - name: Scraper Scriptini Çalıştır
        run: python scraper.py

      - name: Güncellenmiş Veriyi GitHub'a Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.json
          git commit -m "Auto-update match data" || exit 0
          git push
