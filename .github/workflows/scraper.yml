name: Bundesliga Data Scraper
on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright curl_cffi
          playwright install --with-deps chromium
      - name: TV / Fikstür Scraperini Çalıştır
        run: python scraper.py
      - name: Değişiklikleri GitHub Pages/Repo'ya Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
         - name: Değişiklikleri GitHub'a Push Et
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bl1_data.json bl2_data.json
          git commit -m "Auto-update lig verileri" || echo "Değişiklik yok"
          git push
