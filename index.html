<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almanya TV Yayın Akışı (EPG)</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #00adb5;
      --accent-hover: #008c93;
      --text-color: #eeeeee;
      --subtext-color: #aaaaaa;
      --border-color: #2a2a32;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 1.8rem;
      color: var(--accent-color);
    }

    #last-updated {
      font-size: 0.85rem;
      color: var(--subtext-color);
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .channel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .channel-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .channel-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 0 0 10px 0;
    }

    .program-time {
      font-size: 0.9rem;
      color: #ffb703;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .program-title {
      font-size: 1rem;
      line-height: 1.4;
      margin: 0 0 15px 0;
      flex-grow: 1;
    }

    .btn-detail {
      display: inline-block;
      text-align: center;
      background-color: var(--accent-color);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
    }

    .btn-detail:hover {
      background-color: var(--accent-hover);
    }

    .loading {
      text-align: center;
      grid-column: 1 / -1;
      font-size: 1.2rem;
      color: var(--subtext-color);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📺 Almanya TV Yayın Akışı</h1>
    <div id="last-updated">Yayın bilgileri yükleniyor...</div>
  </header>

  <main>
    <div class="channel-grid" id="channel-container">
      <div class="loading">Güncel program verileri getiriliyor...</div>
    </div>
  </main>

  <script>
    async function fetchEPG() {
      const container = document.getElementById("channel-container");
      const updatedText = document.getElementById("last-updated");

      try {
        // epg.json dosyasını tarayıcı önbelleğine takılmadan taze çek
        const response = await fetch(`epg.json?t=${new Date().getTime()}`);
        
        if (!response.ok) {
          throw new Error("epg.json dosyası okunamadı.");
        }

        const data = await response.json();
        
        // Son güncelleme zamanını göster
        if (data.date) {
          updatedText.textContent = `Son Güncelleme: ${data.date}`;
        }

        container.innerHTML = "";

        const channels = data.channels || {};
        
        if (Object.keys(channels).length === 0) {
          container.innerHTML = `<div class="loading">Henüz yayın akış bilgisi bulunamadı.</div>`;
          return;
        }

        // Kanal Kartlarını Oluştur
        for (const [channelName, programs] of Object.entries(channels)) {
          const currentProgram = programs[0] || {
            time: "--:--",
            endTime: "--:--",
            title: "Yayın bilgisi bulunamadı",
            url: "https://www.tvspielfilm.de/tv-programm/"
          };

          const card = document.createElement("div");
          card.className = "channel-card";

          card.innerHTML = `
            <div>
              <div class="channel-title">${channelName}</div>
              <div class="program-time">⏰ ${currentProgram.time} - ${currentProgram.endTime}</div>
              <div class="program-title">${currentProgram.title}</div>
            </div>
            <a href="${currentProgram.url}" target="_blank" rel="noopener noreferrer" class="btn-detail">
              Program Detayı ↗
            </a>
          `;

          container.appendChild(card);
        }

      } catch (error) {
        console.error("Hata:", error);
        container.innerHTML = `
          <div class="loading" style="color: #ef233c;">
            Yayın bilgileri yüklenirken bir sorun oluştu.<br>
            <small>Lütfen GitHub Actions işleminin başarıyla tamamlandığından emin olun.</small>
          </div>
        `;
      }
    }

    // Sayfa yüklendiğinde EPG verisini çek
    document.addEventListener("DOMContentLoaded", fetchEPG);
  </script>
</body>
</html>
