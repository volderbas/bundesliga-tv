<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundesliga - Spieltag & Live-Ticker</title>
  <style>
    :root {
      /* Siyah yerine göz yormayan soft koyu tema */
      --bg: #1e222d;
      --card-bg: #252936;
      --card-border: #333848;
      --accent: #e10600;
      --text: #f0f2f5;
      --subtext: #9aa0a6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--text);
      font-size: 1.8rem;
      margin: 0 0 5px 0;
      font-weight: 700;
    }

    .subtitle {
      color: var(--subtext);
      font-size: 0.9rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin: 20px 0;
    }

    select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .league-title {
      font-size: 1.2rem;
      color: #38ef7d;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      margin: 25px auto 15px auto;
      max-width: 1100px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Maç Kartı */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .match-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #f39c12;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .teams-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 12px 0;
    }

    /* Takım isimleri için pastel renk etiketleri */
    .team-badge {
      font-size: 0.9rem;
      font-weight: 600;
      width: 42%;
      text-align: center;
      padding: 6px 8px;
      border-radius: 6px;
      line-height: 1.2;
    }

    .score-box {
      background: #181b23;
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #38ef7d;
      text-align: center;
    }

    .broadcaster-box {
      background: #1d212c;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--subtext);
      border: 1px solid var(--card-border);
    }

    /* Modal / Pop-up Canlı Maç Ekranı */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 90%;
      max-width: 950px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 20px;
      background: #181b23;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-weight: 600;
      color: #38ef7d;
      font-size: 1rem;
    }

    .close-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bundesliga - Spieltag & Live-Ticker</h1>
    <div class="subtitle" id="last-update">Daten werden geladen...</div>
  </header>

  <div class="controls">
    <label for="week-select"><strong>Spieltag wählen:</strong></label>
    <select id="week-select"></select>
  </div>

  <div class="league-title">🇩🇪 1. Bundesliga</div>
  <div class="grid" id="b1-grid"></div>

  <div class="league-title">🇩🇪 2. Bundesliga</div>
  <div class="grid" id="b2-grid"></div>

  <!-- Canlı İstatistik Modal Penceresi -->
  <div class="modal-overlay" id="match-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Live Matchcenter</div>
        <button class="close-btn" onclick="closeModal()">Schließen ✕</button>
      </div>
      <div class="modal-body">
        <iframe id="match-frame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    // Bundesliga Takımlarının Pastel Forma Renk Kodları
    const teamColors = {
      "FC Bayern München": { bg: "rgba(220, 53, 69, 0.2)", color: "#ff8080" },
      "Borussia Dortmund": { bg: "rgba(255, 193, 7, 0.2)", color: "#ffe066" },
      "RB Leipzig": { bg: "rgba(235, 64, 52, 0.2)", color: "#ff9999" },
      "Bayer 04 Leverkusen": { bg: "rgba(220, 38, 38, 0.2)", color: "#f87171" },
      "VfB Stuttgart": { bg: "rgba(255, 255, 255, 0.15)", color: "#ffffff" },
      "Eintracht Frankfurt": { bg: "rgba(107, 114, 128, 0.25)", color: "#e5e7eb" },
      "VfL Wolfsburg": { bg: "rgba(34, 197, 94, 0.2)", color: "#4ade80" },
      "SV Werder Bremen": { bg: "rgba(16, 185, 129, 0.2)", color: "#34d399" },
      "1. FC Union Berlin": { bg: "rgba(239, 68, 68, 0.2)", color: "#fca5a5" },
      "BFV Borussia Mönchengladbach": { bg: "rgba(52, 211, 153, 0.15)", color: "#a7f3d0" },
      "FSV Mainz 05": { bg: "rgba(248, 113, 113, 0.2)", color: "#fca5a5" },
      "FC Augsburg": { bg: "rgba(16, 185, 129, 0.15)", color: "#6ee7b7" },
      "TSG 1899 Hoffenheim": { bg: "rgba(59, 130, 246, 0.2)", color: "#93c5fd" },
      "1. FC Heidenheim 1846": { bg: "rgba(239, 68, 68, 0.15)", color: "#fca5a5" },
      "FC St. Pauli": { bg: "rgba(180, 83, 9, 0.2)", color: "#fcd34d" },
      "Holstein Kiel": { bg: "rgba(96, 165, 250, 0.2)", color: "#bfdbfe" }
    };

    function getTeamStyle(teamName) {
      const match = Object.keys(teamColors).find(k => teamName.includes(k) || k.includes(teamName));
      if (match) return teamColors[match];
      return { bg: "rgba(255, 255, 255, 0.08)", color: "#e2e8f0" };
    }

    let globalData = null;

    async function init() {
      try {
        const res = await fetch(`epg.json?t=${new Date().getTime()}`);
        if (!res.ok) return;

        globalData = await res.json();
        document.getElementById("last-update").textContent = `Aktualisiert: ${globalData.date_str || ''}`;

        populateWeekSelect(globalData.current_b1_week || 1);
        renderWeek(globalData.current_b1_week || 1);
      } catch (err) {
        console.error("Fehler beim Laden:", err);
      }
    }

    function populateWeekSelect(currentWeek) {
      const select = document.getElementById("week-select");
      select.innerHTML = "";

      for (let i = 1; i <= 34; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${i}. Spieltag ${i === currentWeek ? '(Aktuell)' : ''}`;
        if (i === currentWeek) opt.selected = true;
        select.appendChild(opt);
      }

      select.addEventListener("change", (e) => renderWeek(parseInt(e.target.value)));
    }

    function renderWeek(weekNum) {
      if (!globalData) return;
      renderMatches("b1-grid", (globalData.bundesliga_1[weekNum] || {}).matches || []);
      renderMatches("b2-grid", (globalData.bundesliga_2[weekNum] || {}).matches || []);
    }

    function renderMatches(containerId, matches) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if (matches.length === 0) {
        container.innerHTML = `<div style="color:var(--subtext); padding:10px;">Keine Spiele gefunden.</div>`;
        return;
      }

      matches.forEach(m => {
        const t1Style = getTeamStyle(m.team1);
        const t2Style = getTeamStyle(m.team2);

        const card = document.createElement("div");
        card.className = "match-card";
        card.onclick = () => openModal(`${m.team1} vs ${m.team2}`, m.data_url);

        card.innerHTML = `
          <div class="match-meta">
            <span>📅 ${m.date_tr}</span>
            <span>⏰ ${m.time_tr} (TSİ)</span>
          </div>

          <div class="teams-container">
            <div class="team-badge" style="background:${t1Style.bg}; color:${t1Style.color};">${m.team1}</div>
            <div class="score-box">${m.score}</div>
            <div class="team-badge" style="background:${t2Style.bg}; color:${t2Style.color};">${m.team2}</div>
          </div>

          <div class="broadcaster-box">
            📺 Sender: <strong>${m.broadcaster}</strong>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openModal(title, url) {
      document.getElementById("modal-title").textContent = title + " - Live Matchcenter";
      document.getElementById("match-frame").src = url;
      document.getElementById("match-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("match-modal").classList.remove("active");
      document.getElementById("match-frame").src = "";
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
