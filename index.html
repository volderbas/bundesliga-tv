<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121316">
  <title>Live TV Germany EPG</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Gömülü Canlı Yayın Oynatıcı Kütüphanesi (HLS.js) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    :root {
      --bg: #121316;
      --card-bg: #1c1d22;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --germany-red: #e11d48;
      --germany-gold: #fbbf24;
      --live-green: #10b981;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--germany-gold);
    }

    .updated-at {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .channel-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .channel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .channel-ARD { color: #60a5fa; }
    .channel-ZDF { color: #fb923c; }
    .channel-RTL { color: #f43f5e; }
    .channel-RTL2 { color: #fb7185; }
    .channel-SAT1 { color: #38bdf8; }
    .channel-ProSieben { color: #a78bfa; }
    .channel-3sat { color: #4ade80; }
    .channel-ONE { color: #c084fc; }
    .channel-Sky { color: #0284c7; }
    .channel-DAZN { color: #facc15; }

    .badge {
      background: var(--germany-red);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .program-info {
      text-decoration: none;
      color: inherit;
    }

    .program-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: #fafafa;
    }

    .program-time {
      font-size: 0.85rem;
      color: var(--germany-gold);
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
    }

    .btn-detail {
      background: #27272a;
      color: var(--text-muted);
      border: 1px solid #3f3f46;
    }

    .btn-live {
      background: var(--live-green);
      color: #064e3b;
      font-weight: 700;
    }

    /* Gömülü Video Player Modal Tasarımı */
    .player-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 16px;
    }

    .player-container {
      width: 100%;
      max-width: 850px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid #27272a;
    }

    video {
      width: 100%;
      height: auto;
      max-height: 75vh;
      display: block;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(225, 29, 72, 0.85);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      z-index: 10;
      font-size: 0.85rem;
    }

    .close-btn:hover {
      background: rgba(225, 29, 72, 1);
    }
  </style>
</head>
<body>

  <header>
    <h1>📺 Live TV Germany</h1>
    <div id="update-time" class="updated-at">Yükleniyor...</div>
  </header>

  <div id="channels-container" class="channel-grid"></div>

  <!-- Sitede Açılan Gömülü Oynatıcı -->
  <div id="playerModal" class="player-modal">
    <div class="player-container">
      <button class="close-btn" onclick="closePlayer()">✕ Kapat</button>
      <video id="videoPlayer" controls autoplay preload="auto"></video>
    </div>
  </div>

  <script>
    // Kanallara ait doğrudan canlı yayın (.m3u8) adresleri
    // Kendi m3u8 adreslerinizi veya Vavoo m3u8 linklerini buraya ekleyebilirsiniz.
    const STREAM_MAP = {
      "ARD": "https://marlin.ard-m3u8.de/live/ard.m3u8",
      "ZDF": "https://zdf-hls-15.akamaized.net/hls/live/2016498/de/veryhigh/master.m3u8",
      "3sat": "https://zdf-hls-16.akamaized.net/hls/live/2016499/de/veryhigh/master.m3u8",
      "ONE": "https://marlin.ard-m3u8.de/live/one.m3u8",
      "RTL": "",
      "RTL2": "",
      "SAT.1": "",
      "ProSieben": "",
      "Sky Sport Bundesliga 1": "",
      "Sky Sport Bundesliga 2": "",
      "Sky Sport Bundesliga 3": "",
      "Sky Sport Bundesliga 4": "",
      "Sky Sport Bundesliga 5": "",
      "DAZN 1": "",
      "DAZN 2": ""
    };

    function playStream(channelName) {
      const streamUrl = STREAM_MAP[channelName];
      
      if (!streamUrl || streamUrl.trim() === "") {
        alert(`${channelName} kanalı için gömülü yayın adresi (.m3u8) henüz STREAM_MAP listesine eklenmemiş.`);
        return;
      }

      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      modal.style.display = 'flex';

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
        window.currentHls = hls;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Safari / iOS cihazlar için native HLS desteği
        video.src = streamUrl;
        video.play();
      }
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      video.pause();
      video.removeAttribute('src');
      video.load();
      
      if (window.currentHls) {
        window.currentHls.destroy();
        window.currentHls = null;
      }
      modal.style.display = 'none';
    }

    async function loadEPG() {
      try {
        const response = await fetch('epg.json?t=' + new Date().getTime());
        const data = await response.json();
        
        document.getElementById('update-time').innerText = `Son: ${data.date}`;
        const container = document.getElementById('channels-container');
        container.innerHTML = '';

        const now = new Date();
        const germanTimeStr = now.toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: '2-digit', minute: '2-digit' });
        const [gHour, gMin] = germanTimeStr.split(':').map(Number);
        const currentMinutes = gHour * 60 + gMin;

        for (const [channel, programs] of Object.entries(data.channels)) {
          let currentProgram = null;

          for (const prog of programs) {
            if (!prog.time || prog.time === "--:--") continue;
            const [sh, sm] = prog.time.split(':').map(Number);
            
            let endMin = currentMinutes + 60; 
            if (prog.endTime && prog.endTime !== "--:--") {
              const [eh, em] = prog.endTime.split(':').map(Number);
              endMin = eh * 60 + em;
            }

            const startMin = sh * 60 + sm;
            if (endMin < startMin) endMin += 24 * 60;

            if (currentMinutes >= startMin && currentMinutes < endMin) {
              currentProgram = prog;
              break;
            }
          }

          const displayProg = currentProgram || (programs.length > 0 ? programs[0] : { title: "Yayın bilgisi yükleniyor...", time: "--:--", endTime: "--:--", url: "#" });
          
          let safeChannelClass = channel.replace('.', '').replace(/\s+/g, '');
          if (channel.startsWith("Sky")) safeChannelClass = "Sky";
          if (channel.startsWith("DAZN")) safeChannelClass = "DAZN";

          const card = document.createElement('div');
          card.className = 'channel-card';
          
          card.innerHTML = `
            <div class="channel-header">
              <span class="channel-name channel-${safeChannelClass}">${channel}</span>
              <span class="badge">CANLI</span>
            </div>
            
            <a href="${displayProg.url || '#'}" target="_blank" class="program-info">
              <div class="program-title">${displayProg.title}</div>
              <div class="program-time">⏰ ${displayProg.time} - ${displayProg.endTime}</div>
            </a>

            <div class="card-actions">
              <a href="${displayProg.url || '#'}" target="_blank" class="btn btn-detail">📖 Program Detayı</a>
              <button onclick="playStream('${channel}')" class="btn btn-live">▶ Canlı İzle</button>
            </div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById('channels-container').innerHTML = 
          '<p style="color:#ef4444; text-align:center;">Veriler yüklenirken bir sorun oluştu.</p>';
      }
    }

    loadEPG();
    setInterval(loadEPG, 60000);
  </script>
</body>
</html>
