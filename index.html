<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundesliga Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --german-red: #dd0000;
            --german-gold: #ffce00;
            --pastel-blue: #e8f0fe;
            --border-color: #e2e8f0;
        }

        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .header-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 3px solid var(--german-gold); padding-bottom: 10px; }
        .tab-btn { background: var(--card-bg); border: 1px solid #ccc; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 6px 6px 0 0; }
        .tab-btn.active { border-color: var(--german-red); color: var(--german-red); border-bottom: 3px solid var(--german-red); }

        .dashboard-grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 20px; }
        @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-top: 4px solid var(--german-gold); margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg-color); padding-bottom: 10px; margin-bottom: 15px; }
        .card-header h2 { margin: 0; font-size: 18px; }

        /* Hafta Navigasyonu Style */
        .spieltag-nav { display: flex; align-items: center; gap: 6px; }
        .nav-btn { background: var(--bg-color); border: 1px solid #ccc; border-radius: 4px; padding: 4px 10px; font-weight: bold; cursor: pointer; }
        .nav-btn:hover { background: #e2e8f0; }
        .spieltag-select { padding: 5px 8px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }

        .match-item { border-bottom: 1px solid var(--border-color); padding: 12px 0; }
        .match-main { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 14px; user-select: none; }
        .match-main:hover { background-color: #fafafa; }
        .match-teams { font-weight: 600; }
        .match-score { background: var(--pastel-blue); padding: 4px 10px; border-radius: 6px; font-weight: bold; min-width: 50px; text-align: center; }
        
        .match-details { display: none; margin-top: 10px; padding: 12px; background: #fafafa; border-radius: 8px; border-left: 3px solid var(--german-red); font-size: 13px; }
        .details-section { margin-bottom: 10px; }
        .details-title { font-weight: bold; color: var(--german-red); margin-bottom: 4px; display: block; border-bottom: 1px dashed #ccc; padding-bottom: 2px; }
        
        .lineup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
        .lineup-col ul { list-style: none; padding-left: 0; margin: 0; }
        .lineup-col li { padding: 2px 0; border-bottom: 1px solid #eee; }

        .table-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .table-header { font-weight: bold; background: var(--pastel-blue); padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-tabs">
            <button class="tab-btn active" id="btn-bl1" onclick="loadData('bl1')">1. Bundesliga</button>
            <button class="tab-btn" id="btn-bl2" onclick="loadData('bl2')">2. Bundesliga</button>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header">
                    <h2>Bundesliga Spieltag</h2>
                    <div class="spieltag-nav">
                        <button class="nav-btn" onclick="stepSpieltag(-1)">&lt;</button>
                        <select id="spieltag-select" class="spieltag-select" onchange="changeSpieltag(this.value)"></select>
                        <button class="nav-btn" onclick="stepSpieltag(1)">&gt;</button>
                    </div>
                </div>
                <div id="fixtures-container">Wird geladen...</div>
            </div>

            <div class="card">
                <div class="card-header"><h2>Tabelle</h2></div>
                <div id="tabelle-container">Wird geladen...</div>
            </div>
        </div>
    </div>

    <script>
        let currentLeagueData = null;

        document.addEventListener("DOMContentLoaded", () => loadData('bl1'));

        function loadData(league) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${league}`);
            if (activeBtn) activeBtn.classList.add('active');

            fetch(`${league}_data.json?t=${new Date().getTime()}`, { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    currentLeagueData = data;
                    setupSpieltagSelect(data);
                    renderTabelle(data.tabelle || []);
                })
                .catch(() => {
                    document.getElementById("fixtures-container").innerHTML = "<p style='color:red;'>Daten konnten nicht geladen werden.</p>";
                });
        }

        function setupSpieltagSelect(data) {
            const select = document.getElementById("spieltag-select");
            select.innerHTML = "";
            
            if (data.spieltage && Object.keys(data.spieltage).length > 0) {
                const keys = Object.keys(data.spieltage).sort((a,b) => parseInt(a) - parseInt(b));
                
                keys.forEach(st => {
                    const opt = document.createElement("option");
                    opt.value = st;
                    opt.textContent = `${st}. Spieltag`;
                    select.appendChild(opt);
                });

                const targetWeek = String(data.current_spieltag || keys[0]);
                select.value = keys.includes(targetWeek) ? targetWeek : keys[0];

                renderFixtures(data.spieltage[select.value] || []);
            } else {
                renderFixtures([]);
            }
        }

        function changeSpieltag(st) {
            if (currentLeagueData && currentLeagueData.spieltage) {
                renderFixtures(currentLeagueData.spieltage[st] || []);
            }
        }

        function stepSpieltag(direction) {
            const select = document.getElementById("spieltag-select");
            if (!select || !select.options.length) return;
            
            let newIndex = select.selectedIndex + direction;
            if (newIndex >= 0 && newIndex < select.options.length) {
                select.selectedIndex = newIndex;
                changeSpieltag(select.value);
            }
        }

        function renderFixtures(fixtures) {
            const container = document.getElementById("fixtures-container");
            container.innerHTML = "";
            if (!fixtures || fixtures.length === 0) { 
                container.innerHTML = "<p>Keine Spiele gefunden.</p>"; 
                return; 
            }

            fixtures.forEach((m, idx) => {
                const scoreOrTime = m.score ? m.score : `${m.date || ''} ${m.time ? '- ' + m.time : ''}`;
                
                const goalsHtml = (m.goals && m.goals.length) 
                    ? `<div class="details-section"><span class="details-title">⚽ Tore</span>${m.goals.join("<br>")}</div>` : "";
                
                const cardsHtml = (m.cards && m.cards.length) 
                    ? `<div class="details-section"><span class="details-title">🟨 / 🟥 Karten</span>${m.cards.join("<br>")}</div>` : "";

                let lineupsHtml = "";
                if (m.lineups && (m.lineups.home?.length || m.lineups.away?.length)) {
                    lineupsHtml = `
                        <div class="details-section">
                            <span class="details-title">📋 Startelf (İlk 11'ler)</span>
                            <div class="lineup-grid">
                                <div class="lineup-col">
                                    <strong>${m.home}</strong>
                                    <ul>${(m.lineups.home || []).map(p => `<li>${p}</li>`).join("")}</ul>
                                </div>
                                <div class="lineup-col">
                                    <strong>${m.away}</strong>
                                    <ul>${(m.lineups.away || []).map(p => `<li>${p}</li>`).join("")}</ul>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (!m.score) {
                    lineupsHtml = `<div class="details-section"><em>Kadro bilgisi maç saatine 1 saat kala güncellenir.</em></div>`;
                }

                container.innerHTML += `
                    <div class="match-item">
                        <div class="match-main" onclick="toggleDetails(${idx})">
                            <span class="match-teams">${m.home} vs ${m.away}</span>
                            <span class="match-score">${scoreOrTime}</span>
                        </div>
                        <div class="match-details" id="details-${idx}">
                            ${goalsHtml}
                            ${cardsHtml}
                            ${lineupsHtml}
                        </div>
                    </div>
                `;
            });
        }

        function toggleDetails(idx) {
            const el = document.getElementById(`details-${idx}`);
            if (el) {
                el.style.display = (el.style.display === "block") ? "none" : "block";
            }
        }

        function renderTabelle(tabelle) {
            const container = document.getElementById("tabelle-container");
            container.innerHTML = `
                <div class="table-row table-header">
                    <span style="width:10%">#</span>
                    <span style="width:55%">Team</span>
                    <span style="width:15%">Pkt</span>
                    <span style="width:20%">Diff</span>
                </div>
            `;
            tabelle.forEach((t, i) => {
                container.innerHTML += `
                    <div class="table-row">
                        <span style="width:10%">${i+1}</span>
                        <span style="width:55%; font-weight:600">${t.name}</span>
                        <span style="width:15%; font-weight:bold">${t.points}</span>
                        <span style="width:20%">${t.goalDiff}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
