<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundesliga - Spieltag & Live-Ticker</title>
  <style>
    :root {
      --bg: #1e222d;
      --card-bg: #252936;
      --card-border: #333848;
      --accent: #e10600;
      --text: #f0f2f5;
      --subtext: #9aa0a6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--text); font-size: 1.8rem; margin: 0 0 5px 0; }
    .subtitle { color: var(--subtext); font-size: 0.9rem; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 20px 0; }
    select { background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); padding: 10px 16px; border-radius: 8px; font-size: 1rem; }

    .league-title { font-size: 1.2rem; color: #38ef7d; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; margin: 25px auto 15px auto; max-width: 1100px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }

    .match-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; cursor: pointer; }
    .match-card:hover { transform: translateY(-3px); }

    .match-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: #f39c12; margin-bottom: 12px; }
    .teams-container { display: flex; align-items: center; justify-content: space-between; margin: 12px 0; }
    .team-badge { font-size: 0.9rem; font-weight: 600; width: 42%; text-align: center; padding: 6px 8px; border-radius: 6px; }
    .score-box { background: #181b23; border: 1px solid var(--card-border); padding: 6px 12px; border-radius: 6px; font-size: 1.1rem; font-weight: bold; color: #38ef7d; }
    .broadcaster-box { background: #1d212c; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.85rem; color: var(--subtext); border: 1px solid var(--card-border); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 17, 23, 0.85); z-index: 1000; justify-content: center; align-items: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; width: 90%; max-width: 550px; max-height: 80vh; display: flex; flex-direction: column; }
    .modal-header { padding: 14px 20px; background: #181b23; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .close-btn { background: var(--accent); color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    .modal-body { padding: 20px; overflow-y: auto; }
    .goal-item { display: flex; justify-content: space-between; background: #181b23; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>Bundesliga - Spieltag & Live-Ticker</h1>
    <div class="subtitle" id="last-update">Daten werden geladen...</div>
  </header>

  <div class="controls">
    <label for="week-select"><strong>Spieltag wählen:</strong></label>
    <select id="week-select"></select>
  </div>

  <div class="league-title">🇩🇪 1. Bundesliga</div>
  <div class="grid" id="b1-grid"></div>

  <div class="modal-overlay" id="match-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title" style="color:#38ef7d; font-weight:bold;">Matchdetails</div>
        <button class="close-btn" onclick="closeModal()">Schließen ✕</button>
      </div>
      <div class="modal-body" id="modal-body-content"></div>
    </div>
  </div>

  <script>
    const teamColors = {
      "FC Bayern München": { bg: "rgba(220, 53, 69, 0.2)", color: "#ff8080" },
      "Borussia Dortmund": { bg: "rgba(255, 193, 7, 0.2)", color: "#ffe066" },
      "RB Leipzig": { bg: "rgba(235, 64, 52, 0.2)", color: "#ff9999" },
      "Bayer 04 Leverkusen": { bg: "rgba(220, 38, 38, 0.2)", color: "#f87171" }
    };

    function getTeamStyle(teamName) {
      const match = Object.keys(teamColors).find(k => teamName.includes(k) || k.includes(teamName));
      return match ? teamColors[match] : { bg: "rgba(255, 255, 255, 0.08)", color: "#e2e8f0" };
    }

    let globalData = null;

    async function init() {
      try {
        const res = await fetch(`epg.json?t=${new Date().getTime()}`);
        if (!res.ok) return;
        globalData = await res.json();
        document.getElementById("last-update").textContent = `Aktualisiert: ${globalData.date_str || ''}`;
        populateWeekSelect(1);
        renderWeek(1);
      } catch (err) { console.error(err); }
    }

    function populateWeekSelect(currentWeek) {
      const select = document.getElementById("week-select");
      select.innerHTML = "";
      for (let i = 1; i <= 34; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${i}. Spieltag`;
        if (i === currentWeek) opt.selected = true;
        select.appendChild(opt);
      }
      select.addEventListener("change", (e) => renderWeek(parseInt(e.target.value)));
    }

    function renderWeek(weekNum) {
      if (!globalData) return;
      const matches = (globalData.bundesliga_1[weekNum] || {}).matches || [];
      const container = document.getElementById("b1-grid");
      container.innerHTML = "";

      matches.forEach(m => {
        const t1 = getTeamStyle(m.team1);
        const t2 = getTeamStyle(m.team2);
        const card = document.createElement("div");
        card.className = "match-card";
        card.onclick = () => openDetails(m);
        card.innerHTML = `
          <div class="match-meta"><span>📅 ${m.date_tr}</span><span>⏰ ${m.time_tr} (TSİ)</span></div>
          <div class="teams-container">
            <div class="team-badge" style="background:${t1.bg}; color:${t1.color};">${m.team1}</div>
            <div class="score-box">${m.score}</div>
            <div class="team-badge" style="background:${t2.bg}; color:${t2.color};">${m.team2}</div>
          </div>
          <div class="broadcaster-box">📺 Sender: <strong>${m.broadcaster}</strong></div>
        `;
        container.appendChild(card);
      });
    }

    function openDetails(m) {
      document.getElementById("modal-title").textContent = `${m.team1} ${m.score} ${m.team2}`;
      const body = document.getElementById("modal-body-content");
      let html = "";
      if (m.goals && m.goals.length > 0) {
        m.goals.forEach(g => {
          html += `<div class="goal-item"><span>⏱️ ${g.minute}'</span><span>⚽ ${g.scorer}</span><span>(${g.score1}-${g.score2})</span></div>`;
        });
      } else {
        html = "<div style='text-align:center; color:#9aa0a6;'>Henüz detay/gol kaydı yok.</div>";
      }
      body.innerHTML = html;
      document.getElementById("match-modal").classList.add("active");
    }

    function closeModal() { document.getElementById("match-modal").classList.remove("active"); }
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
