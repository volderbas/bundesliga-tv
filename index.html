<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundesliga Canlı Maç Rehberi</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card-bg: #18181c;
      --accent: #d1121d;
      --border: #282830;
      --text: #ffffff;
      --subtext: #aaaaaa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--accent);
      margin: 0 0 5px 0;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    select {
      background: var(--card-bg);
      color: #fff;
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--accent);
    }

    .league-title {
      font-size: 1.3rem;
      color: #00adb5;
      border-bottom: 2px solid var(--border);
      padding-bottom: 5px;
      margin: 20px auto 15px auto;
      max-width: 1100px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Maç Kartı Stili & Tıklanabilirlik */
    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .match-card:hover {
      transform: translateY(-3px);
      border-color: #00adb5;
      box-shadow: 0 4px 15px rgba(0, 173, 181, 0.2);
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #ffb703;
      font-weight: bold;
    }

    .teams-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 600;
      width: 40%;
      text-align: center;
    }

    .score-box {
      background: #22222a;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #00adb5;
      text-align: center;
    }

    .broadcaster-box {
      background: #25252e;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
      border: 1px solid #333;
    }

    /* Site İçi Canlı Maç Modalı (Pop-up Pencere) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-header {
      padding: 15px 20px;
      background: #22222a;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-weight: bold;
      color: #00adb5;
      font-size: 1.1rem;
    }

    .close-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #fff;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>⚽ Bundesliga Haftalık Fikstür & Canlı Maçlar</h1>
    <p id="last-update" style="color:#aaa; font-size:0.85rem;">Yükleniyor...</p>
  </header>

  <div class="controls">
    <label for="week-select"><strong>Maç Haftası Seçin:</strong></label>
    <select id="week-select"></select>
  </div>

  <div class="league-title">🇩🇪 1. Bundesliga</div>
  <div class="grid" id="b1-grid"></div>

  <div class="league-title">🇩🇪 2. Bundesliga</div>
  <div class="grid" id="b2-grid"></div>

  <!-- Site İçi Açılır Canlı Ticker Penceresi -->
  <div class="modal-overlay" id="ticker-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-match-title">Canlı Maç Ticker</div>
        <button class="close-btn" onclick="closeModal()">Kapat ✕</button>
      </div>
      <div class="modal-body">
        <iframe id="ticker-frame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    let globalData = null;

    async function init() {
      try {
        const response = await fetch(`epg.json?t=${new Date().getTime()}`);
        if (!response.ok) return;

        globalData = await response.json();
        
        document.getElementById("last-update").textContent = 
          `Son Veri Güncellemesi: ${globalData.date_str || ''}`;

        populateWeekSelect(globalData.current_b1_week || 1);
        renderWeek(globalData.current_b1_week || 1);

      } catch (err) {
        console.error("Fikstür verisi yüklenemedi:", err);
      }
    }

    function populateWeekSelect(currentWeek) {
      const select = document.getElementById("week-select");
      select.innerHTML = "";

      for (let i = 1; i <= 34; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `${i}. Hafta ${i === currentWeek ? '(Mevcut Hafta)' : ''}`;
        if (i === currentWeek) opt.selected = true;
        select.appendChild(opt);
      }

      select.addEventListener("change", (e) => {
        renderWeek(parseInt(e.target.value));
      });
    }

    function renderWeek(weekNum) {
      if (!globalData) return;

      const b1WeekData = globalData.bundesliga_1[weekNum] || { matches: [] };
      const b2WeekData = globalData.bundesliga_2[weekNum] || { matches: [] };

      renderMatches("b1-grid", b1WeekData.matches);
      renderMatches("b2-grid", b2WeekData.matches);
    }

    function renderMatches(containerId, matches) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if (!matches || matches.length === 0) {
        container.innerHTML = `<div style="color:#aaa; padding:15px;">Bu hafta için maç verisi bulunamadı.</div>`;
        return;
      }

      matches.forEach(m => {
        const card = document.createElement("div");
        card.className = "match-card";
        
        // Bütün kart tıklanabilir hale getirildi
        card.onclick = () => openModal(`${m.team1} vs ${m.team2}`, m.ticker_url);

        card.innerHTML = `
          <div>
            <div class="match-meta">
              <span>📅 ${m.date_tr}</span>
              <span>⏰ ${m.time_tr} (TSİ)</span>
            </div>

            <div class="teams-container">
              <div class="team-name">${m.team1}</div>
              <div class="score-box">${m.score}</div>
              <div class="team-name">${m.team2}</div>
            </div>

            <div class="broadcaster-box">
              📺 Yayıncı: <strong>${m.broadcaster}</strong>
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function openModal(title, url) {
      document.getElementById("modal-match-title").textContent = title + " - Canlı Maç Verileri";
      document.getElementById("ticker-frame").src = url;
      document.getElementById("ticker-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("ticker-modal").classList.remove("active");
      document.getElementById("ticker-frame").src = "";
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
