<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bundesliga TV EPG</title>
  <!-- Android & PWA Özellikleri -->
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Bundesliga TV">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/732/732200.png">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --live-badge: #ef4444;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.4rem; color: var(--accent); }
    .updated-at { font-size: 0.8rem; color: var(--text-muted); }
    .channel-grid { display: flex; flex-direction: column; gap: 12px; }
    .channel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }
    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .channel-name { font-weight: bold; font-size: 1.1rem; color: #fff; }
    .badge {
      background: var(--live-badge);
      color: white;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }
    .badge-offline {
      background: #475569;
      color: #cbd5e1;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .program-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
    .program-time { font-size: 0.85rem; color: var(--accent); }
    .program-genre { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📺 Live TV Germany</h1>
    <div id="update-time" class="updated-at">Yükleniyor...</div>
  </header>

  <div id="channels-container" class="channel-grid"></div>

  <script>
    async function loadEPG() {
      try {
        const response = await fetch('epg.json?t=' + new Date().getTime());
        const data = await response.json();
        
        document.getElementById('update-time').innerText = `Son Güncelleme: ${data.date}`;
        const container = document.getElementById('channels-container');
        container.innerHTML = '';

        // Almanya Saatine (CET/CEST) göre dakikayı hesapla
        const now = new Date();
        const germanTimeStr = now.toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: '2-digit', minute: '2-digit' });
        const [gHour, gMin] = germanTimeStr.split(':').map(Number);
        const currentMinutes = gHour * 60 + gMin;

        for (const [channel, programs] of Object.entries(data.channels)) {
          let currentProgram = null;

          for (const prog of programs) {
            const [sh, sm] = prog.time.split(':').map(Number);
            const [eh, em] = prog.endTime.split(':').map(Number);
            const startMin = sh * 60 + sm;
            let endMin = eh * 60 + em;
            if (endMin < startMin) endMin += 24 * 60; // Gece yarısı geçişi

            if (currentMinutes >= startMin && currentMinutes < endMin) {
              currentProgram = prog;
              break;
            }
          }

          const card = document.createElement('div');
          card.className = 'channel-card';
          
          if (currentProgram) {
            card.innerHTML = `
              <div class="channel-header">
                <span class="channel-name">${channel}</span>
                <span class="badge">CANLI</span>
              </div>
              <div class="program-title">${currentProgram.title}</div>
              <div class="program-time">⏰ ${currentProgram.time} - ${currentProgram.endTime}</div>
              <div class="program-genre">🏷️ ${currentProgram.genre}</div>
            `;
          } else {
            // Canlı yayın saati tutmuyorsa günün ilk akış bilgisini göster
            const fallback = programs.length > 0 ? programs[0] : null;
            card.innerHTML = `
              <div class="channel-header">
                <span class="channel-name">${channel}</span>
                <span class="badge-offline">AKIŞ DIŞI</span>
              </div>
              <div class="program-title">${fallback ? fallback.title : 'Yayın bilgisi yok'}</div>
              <div class="program-time">⏰ ${fallback ? fallback.time + ' - ' + fallback.endTime : '--:--'}</div>
              <div class="program-genre">🏷️ Akış saat aralığı dışında</div>
            `;
          }
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById('channels-container').innerHTML = 
          '<p style="color:red; text-align:center;">epg.json okunurken bir sorun oluştu.</p>';
      }
    }

    loadEPG();
    setInterval(loadEPG, 60000); // 1 dakikada bir arayüzü yeniler
  </script>
</body>
</html>
