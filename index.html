<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundesliga Canlı Maç & Yayın Rehberi</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card-bg: #18181c;
      --accent: #d1121d;
      --border: #282830;
      --text: #ffffff;
      --subtext: #aaaaaa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--accent);
      margin: 0 0 5px 0;
    }

    .refresh-info {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .league-title {
      font-size: 1.3rem;
      color: #00adb5;
      border-bottom: 2px solid var(--border);
      padding-bottom: 5px;
      margin: 30px auto 15px auto;
      max-width: 1100px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .match-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .match-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #ffb703;
      font-weight: bold;
    }

    .teams-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0;
    }

    .team-name {
      font-size: 0.95rem;
      font-weight: 600;
      width: 40%;
      text-align: center;
    }

    .score-box {
      background: #22222a;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #00adb5;
      text-align: center;
    }

    .broadcaster-box {
      background: #25252e;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.85rem;
      margin-bottom: 10px;
      border: 1px solid #333;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-ticker {
      flex: 1;
      text-align: center;
      background: #333;
      color: #fff;
      text-decoration: none;
      padding: 8px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-ticker:hover {
      background: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <h1>⚽ Bundesliga Canlı Maç & Yayın Rehberi</h1>
    <div class="refresh-info" id="last-update">Veriler yükleniyor...</div>
  </header>

  <div class="league-title">🇩🇪 1. Bundesliga</div>
  <div class="grid" id="b1-grid"></div>

  <div class="league-title">🇩🇪 2. Bundesliga</div>
  <div class="grid" id="b2-grid"></div>

  <script>
    async function fetchMatches() {
      try {
        const response = await fetch(`epg.json?t=${new Date().getTime()}`);
        if (!response.ok) return;

        const data = await response.json();
        
        document.getElementById("last-update").textContent = 
          `Son Güncelleme: ${data.date_str || ''} (30 saniyede bir anlık yenilenir)`;

        renderLeague("b1-grid", data.bundesliga_1 || []);
        renderLeague("b2-grid", data.bundesliga_2 || []);
      } catch (err) {
        console.error("Veri güncelleme hatası:", err);
      }
    }

    function renderLeague(containerId, matches) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";

      if (matches.length === 0) {
        container.innerHTML = `<div style="color:#aaa;">Maç verisi bulunamadı.</div>`;
        return;
      }

      matches.forEach(m => {
        const card = document.createElement("div");
        card.className = "match-card";

        card.innerHTML = `
          <div>
            <div class="match-meta">
              <span>📅 ${m.date_tr}</span>
              <span>⏰ ${m.time_tr} (TSİ)</span>
            </div>

            <div class="teams-container">
              <div class="team-name">${m.team1}</div>
              <div class="score-box">${m.score}</div>
              <div class="team-name">${m.team2}</div>
            </div>

            <div class="broadcaster-box">
              📺 Yayıncı: <strong>${m.broadcaster}</strong>
            </div>
          </div>

          <div class="btn-group">
            <a href="${m.sofascore_url}" target="_blank" rel="noopener" class="btn-ticker">
              SofaScore ↗
            </a>
            <a href="${m.kicker_url}" target="_blank" rel="noopener" class="btn-ticker">
              Kicker Ticker ↗
            </a>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // İlk çalıştırma
    fetchMatches();

    // 30 saniyede bir otomatik taze veri çek
    setInterval(fetchMatches, 30000);
  </script>
</body>
</html>
