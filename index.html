<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bundesliga Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6; /* Siyah yok, ferah pastel gri/beyaz */
            --card-bg: #ffffff;
            --text-main: #333333;
            --german-red: #DD0000;
            --german-gold: #FFCE00;
            --pastel-blue: #e8f0fe;
            --pastel-green: #e6f4ea;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--german-gold);
            padding-bottom: 10px;
        }
        .tab-btn {
            background-color: var(--card-bg);
            border: 2px solid transparent;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background-color: var(--pastel-blue);
            border-top: 4px solid var(--german-red);
            color: var(--text-main);
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-left: 5px solid var(--german-gold);
        }
        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            font-size: 20px;
        }
        .table-row, .fixture-row, .player-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .table-row:nth-child(even) {
            background-color: #fafafa;
        }
        .team-name { font-weight: 500; }
        .rating-badge {
            background-color: var(--pastel-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header-tabs">
        <button class="tab-btn active" onclick="loadData('bl1')">1. Bundesliga</button>
        <button class="tab-btn" onclick="loadData('bl2')">2. Bundesliga</button>
    </div>

    <div class="dashboard-grid">
        <!-- Sol Kolon: Fikstür -->
        <div class="card">
            <h2>Spieltag (Fikstür)</h2>
            <div id="fixtures-container">Yükleniyor...</div>
        </div>

        <!-- Sağ Kolon: Puan Durumu ve Oyuncular -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <h2>Tabelle (Puan Durumu)</h2>
                <div id="tabelle-container">Yükleniyor...</div>
            </div>
            
            <div class="card" style="border-left-color: var(--german-red);">
                <h2>Top-Spieler (En İyi 10)</h2>
                <div id="players-container">Yükleniyor...</div>
            </div>
        </div>
    </div>

    <script>
        // Sayfa açıldığında 1. Bundesliga'yı yükle
        document.addEventListener("DOMContentLoaded", () => {
            loadData('bl1');
        });

        function loadData(league) {
            // Sekme aktifliğini değiştir
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // JSON dosyasını çek
            fetch(`${league}_data.json`)
                .then(response => response.json())
                .then(data => {
                    renderFixtures(data.fixtures);
                    renderTabelle(data.tabelle);
                    renderPlayers(data.top_players);
                })
                .catch(error => console.error("Veri yüklenemedi:", error));
        }

        function renderFixtures(fixtures) {
            const container = document.getElementById("fixtures-container");
            container.innerHTML = "";
            fixtures.forEach(match => {
                container.innerHTML += `
                    <div class="fixture-row">
                        <span>${match.date} - ${match.time}</span>
                        <span class="team-name">${match.home} vs ${match.away}</span>
                    </div>
                `;
            });
        }

        function renderTabelle(tabelle) {
            const container = document.getElementById("tabelle-container");
            container.innerHTML = `
                <div class="table-row" style="font-weight:bold; background-color: var(--pastel-blue); padding: 5px;">
                    <span style="width: 10%;">#</span>
                    <span style="width: 50%;">Team</span>
                    <span style="width: 20%;">Punkte</span>
                    <span style="width: 20%;">Tordiff</span>
                </div>
            `;
            tabelle.forEach((team, index) => {
                container.innerHTML += `
                    <div class="table-row">
                        <span style="width: 10%;">${index + 1}</span>
                        <span class="team-name" style="width: 50%;">${team.name}</span>
                        <span style="width: 20%; font-weight:bold;">${team.points}</span>
                        <span style="width: 20%;">${team.goalDiff}</span>
                    </div>
                `;
            });
        }

        function renderPlayers(players) {
            const container = document.getElementById("players-container");
            container.innerHTML = "";
            players.forEach((player, index) => {
                container.innerHTML += `
                    <div class="player-row">
                        <span>${index + 1}. <span class="team-name">${player.name}</span> <small>(${player.team})</small></span>
                        <span class="rating-badge">${player.rating}</span>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
