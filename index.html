<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Live TV Germany">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/732/732200.png">
  
  <title>Live TV Germany EPG</title>
  
  <!-- Google Inter Fontu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #121316;
      --card-bg: #1c1d22;
      --card-hover: #262830;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      
      /* Pastel Almanya Renkleri */
      --germany-red: #e11d48;
      --germany-gold: #fbbf24;
      --live-green: #10b981;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #27272a;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--germany-gold);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .updated-at {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .channel-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .channel-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      border: 1px solid #27272a;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-name {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }

    /* Kanal Başlık Renkleri */
    .channel-ARD { color: #60a5fa; }
    .channel-ZDF { color: #fb923c; }
    .channel-RTL { color: #f43f5e; }
    .channel-RTL2 { color: #fb7185; }
    .channel-SAT1 { color: #38bdf8; }
    .channel-ProSieben { color: #a78bfa; }
    .channel-3sat { color: #4ade80; }
    .channel-ONE { color: #c084fc; }
    .channel-Sky { color: #0284c7; }
    .channel-DAZN { color: #facc15; }

    .badge {
      background: var(--germany-red);
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .program-info {
      text-decoration: none;
      color: inherit;
      display: block;
      padding: 4px 0;
      border-radius: 6px;
      transition: opacity 0.2s;
    }

    .program-info:active {
      opacity: 0.7;
    }

    .program-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.3;
      color: #fafafa;
    }

    .program-time {
      font-size: 0.85rem;
      color: var(--germany-gold);
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-detail {
      background: #27272a;
      color: var(--text-muted);
      border: 1px solid #3f3f46;
    }

    .btn-live {
      background: var(--live-green);
      color: #064e3b;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <h1>📺 Live TV Germany</h1>
    <div id="update-time" class="updated-at">Yükleniyor...</div>
  </header>

  <div id="channels-container" class="channel-grid"></div>

  <script>
    // Her kanal için canlı yayın yönlendirmeleri
    const LIVE_URLS = {
      // Ana Akım Kanallar (Resmi Mediathek)
      "ARD": "https://www.ardmediathek.de/live",
      "ZDF": "https://www.zdf.de/live-tv",
      "RTL": "https://www.tvnow.de/live",
      "RTL2": "https://www.joyn.de/live/rtl2",
      "SAT.1": "https://www.joyn.de/live/sat-1",
      "ProSieben": "https://www.joyn.de/live/prosieben",
      "3sat": "https://www.3sat.de/live",
      "ONE": "https://www.ardmediathek.de/live/Y3JpZDovL2Rhc2Vyc3RlLmRlLmxpdmVzdHJlYW0tb25l",
      
      // Sky Bundesliga Kanalları (Vavoo Yönlendirmesi)
      "Sky Sport Bundesliga 1": "https://vavoo.to",
      "Sky Sport Bundesliga 2": "https://vavoo.to",
      "Sky Sport Bundesliga 3": "https://vavoo.to",
      "Sky Sport Bundesliga 4": "https://vavoo.to",
      "Sky Sport Bundesliga 5": "https://vavoo.to",

      // DAZN Kanalları (Vavoo Yönlendirmesi)
      "DAZN 1": "https://vavoo.to",
      "DAZN 2": "https://vavoo.to"
    };

    async function loadEPG() {
      try {
        const response = await fetch('epg.json?t=' + new Date().getTime());
        const data = await response.json();
        
        document.getElementById('update-time').innerText = `Son: ${data.date}`;
        const container = document.getElementById('channels-container');
        container.innerHTML = '';

        const now = new Date();
        const germanTimeStr = now.toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: '2-digit', minute: '2-digit' });
        const [gHour, gMin] = germanTimeStr.split(':').map(Number);
        const currentMinutes = gHour * 60 + gMin;

        for (const [channel, programs] of Object.entries(data.channels)) {
          let currentProgram = null;

          for (const prog of programs) {
            const [sh, sm] = prog.time.split(':').map(Number);
            const [eh, em] = prog.endTime.split(':').map(Number);
            const startMin = sh * 60 + sm;
            let endMin = eh * 60 + em;
            if (endMin < startMin) endMin += 24 * 60;

            if (currentMinutes >= startMin && currentMinutes < endMin) {
              currentProgram = prog;
              break;
            }
          }

          const displayProg = currentProgram || (programs.length > 0 ? programs[0] : { title: "Yayın bilgisi yok", time: "--:--", endTime: "--:--", url: "#" });
          
          let safeChannelClass = channel.replace('.', '').replace(/\s+/g, '');
          if (channel.startsWith("Sky")) safeChannelClass = "Sky";
          if (channel.startsWith("DAZN")) safeChannelClass = "DAZN";

          const liveLink = LIVE_URLS[channel] || "https://vavoo.to";

          const card = document.createElement('div');
          card.className = 'channel-card';
          
          card.innerHTML = `
            <div class="channel-header">
              <span class="channel-name channel-${safeChannelClass}">${channel}</span>
              <span class="badge">CANLI</span>
            </div>
            
            <a href="${displayProg.url || '#'}" target="_blank" class="program-info">
              <div class="program-title">${displayProg.title}</div>
              <div class="program-time">⏰ ${displayProg.time} - ${displayProg.endTime}</div>
            </a>

            <div class="card-actions">
              <a href="${displayProg.url || '#'}" target="_blank" class="btn btn-detail">📖 Program Detayı</a>
              <a href="${liveLink}" target="_blank" class="btn btn-live">▶ Canlı İzle</a>
            </div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById('channels-container').innerHTML = 
          '<p style="color:#ef4444; text-align:center;">Veriler yüklenirken bir sorun oluştu.</p>';
      }
    }

    loadEPG();
    setInterval(loadEPG, 60000);
  </script>
</body>
</html>
